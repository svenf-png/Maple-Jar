name: keepalive

# Hält das Supabase-Projekt aktiv, damit es im Free-Plan nicht wegen Inaktivität pausiert wird.
# URL und öffentlicher Schlüssel kommen ausschließlich aus Repository-Secrets (nie aus dem Repo).
# Hinweis: GitHub kann geplante Workflows in Repos ohne Aktivität nach 60 Tagen deaktivieren.

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping project
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Secrets SUPABASE_URL und SUPABASE_ANON_KEY sind nicht gesetzt. Nichts zu tun."
            exit 0
          fi
          # Lesende Anfrage an die Datenbank (REST). Ohne Anmeldung liefert RLS eine leere Liste;
          # die Anfrage erreicht trotzdem die Datenbank. Nur der Statuscode wird ausgegeben.
          code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --max-time 30 \
            --header "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/household?select=id&limit=1")
          echo "HTTP status: $code"
          case "$code" in
            2*) ;;
            *) echo "Ping fehlgeschlagen." ; exit 1 ;;
          esac
